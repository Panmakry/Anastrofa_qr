<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Είσοδος</title>
    
    <!-- Εισαγωγή του Tailwind CSS για το styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Εισαγωγή του FontAwesome για εικονίδια -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Εισαγωγή της γραμματοσειράς Inter από τα Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center m-0 p-4 antialiased">

    <div class="w-full max-w-sm mx-auto flex flex-col items-center">
        
        <!-- Εικόνα Προφίλ -->
        <img src="Αναστροφα.png" alt="Ανάστροφα" class="w-28 h-28 rounded-full shadow-lg object-contain mb-4 border-2 border-gray-700 bg-white p-2">
        
        <!-- Τίτλος -->
        <h1 class="text-2xl font-bold text-white mb-1 text-center">Ανάστροφα</h1>
        
        <!-- Bio / Περιγραφή -->
        <p class="text-center text-gray-300 mb-8 px-4 text-sm leading-relaxed">
            Στέκι νεολαίας και εργαζομένων
        </p>
        
        <!-- Κουμπιά / Links -->
        <div class="w-full flex flex-col gap-4">
            
            <!-- Instagram Button -->
            <a href="https://www.instagram.com/anastrofa_patra/?__pwa=1" target="_blank" rel="noopener noreferrer" class="w-full bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white font-semibold text-lg py-3.5 px-6 rounded-full shadow-md transition-transform duration-300 ease-out hover:-translate-y-1 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-pink-300 active:scale-95 flex items-center justify-center gap-3">
                <i class="fa-brands fa-instagram text-2xl"></i>
                Instagram
            </a>
            
            <!-- Facebook Button -->
            <a href="https://www.facebook.com/profile.php?id=100092302447592" target="_blank" rel="noopener noreferrer" class="w-full bg-[#1877F2] text-white font-semibold text-lg py-3.5 px-6 rounded-full shadow-md transition-transform duration-300 ease-out hover:-translate-y-1 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300 active:scale-95 flex items-center justify-center gap-3">
                <i class="fa-brands fa-facebook-f text-xl"></i>
                Facebook
            </a>

        </div>
    </div>

</body>
</html>
